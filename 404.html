  <script>
    // GitHub Pages serves this page for any missing path, at any depth. Point relative URLs at the site root:

    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      document.write('<base href="' + base + '">');

  <style>
    :root { --ink: #0E0A14; --plum: #2A1238; --aubergine: #45194F; --gold: #D4A853; --gold-deep: #9C7430; --champagne: #F1DFB6; --ivory: #FAF5EC; }

    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 20px;

    main { max-width: 640px; }
    img { width: min(280px, 70vw); height: auto; margin: 0 auto 20px; display: block; }
    .eyebrow { font-family: Marcellus, Georgia, serif; letter-spacing: .32em; text-transform: uppercase; font-size: .74rem; color: var(--gold); margin: 0 0 18px; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(2.8rem, 9vw, 5.6rem); line-height: .95; margin: 0; }
    h1 em { color: var(--gold); font-weight: 400; }
    .script { font-family: 'Pinyon Script', cursive; color: var(--gold); font-size: clamp(5rem, 22vw, 10rem); line-height: .8; opacity: .9; margin: 0 0 6px; }
    p.lede { color: color-mix(in srgb, var(--ivory) 75%, var(--ink)); margin: 20px auto 30px; max-width: 30rem; line-height: 1.6; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .92rem;
      background: var(--btn-grad, linear-gradient(120deg, #F6E3B0, var(--gold) 40%, var(--gold-deep) 70%, #E7C77E)); background-size: 220% 100%; color: var(--on-gold, var(--ink)); }
    a.btn--ghost { background: transparent; color: var(--ivory); border: 1px solid color-mix(in srgb, var(--ivory) 35%, transparent); }
    a.btn--ghost:hover { border-color: var(--gold); color: var(--gold); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    html[data-mode=light] img.mark { filter: drop-shadow(0 18px 30px rgba(120,90,50,.25)); }
  </style>

</body>
